version: "3.8"

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: smart_exam_backend
    ports:
      - "8000:8000"
    environment:
      - SECRET_KEY=smart-exam-super-secret-key-graduation-project-2026
      - ACCESS_TOKEN_EXPIRE_MINUTES=15
      - REFRESH_TOKEN_EXPIRE_HOURS=2
      - DATABASE_URL=sqlite+aiosqlite:////app/smart_exam.db
      - EVIDENCE_DIR=/app/evidence
    volumes:
      - ./evidence:/app/evidence
      - db_data:/app
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: smart_exam_frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NEXT_PUBLIC_WS_URL=ws://localhost:8000/ws/dashboard
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  ai:
    build:
      context: .
      dockerfile: ai/Dockerfile
    container_name: smart_exam_ai
    environment:
      - BACKEND_URL=http://backend:8000
      - CAMERA_INDEX=0
      - DISPLAY_GUI=false
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ./evidence:/app/evidence
    restart: unless-stopped

volumes:
  db_data:
